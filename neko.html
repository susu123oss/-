<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>日式动漫小猫娘 - Neko Girl</title>
  <style>
    :root {
      --bg: #120b22;
      --card-bg: rgba(26, 16, 48, 0.75);
      --accent: #ff6584;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #301952 0%, #120b22 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 101, 132, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
    }
    .badge {
      align-self: flex-start;
      background: rgba(255, 101, 132, 0.2);
      border: 1px solid rgba(255, 101, 132, 0.4);
      color: #ff8da1;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .svg-container {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1.15;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .svg-container:active {
      transform: scale(0.97);
    }
    .ear-left {
      transform-origin: 140px 140px;
      transition: transform 0.3s ease;
    }
    .ear-right {
      transform-origin: 260px 140px;
      transition: transform 0.3s ease;
    }
    .svg-container:hover .ear-left {
      transform: rotate(-8deg);
    }
    .svg-container:hover .ear-right {
      transform: rotate(8deg);
    }
    .paw {
      transform-origin: 290px 310px;
      animation: pawWave 2.8s ease-in-out infinite alternate;
    }
    @keyframes pawWave {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(-6deg); }
    }
    .title {
      margin-top: 16px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #bfa8db;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span>🐾</span> 日式动漫 · 小猫娘
    </div>
    
    <div class="svg-container" onclick="twitchEars()">
      <svg id="nekoSvg" viewBox="0 0 400 460" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3d2166"/>
            <stop offset="100%" stop-color="#1e1136"/>
          </linearGradient>
          <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e8dcfa"/>
            <stop offset="50%" stop-color="#cbb5ed"/>
            <stop offset="100%" stop-color="#9a7dc9"/>
          </linearGradient>
          <linearGradient id="innerEarGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff9ebb"/>
            <stop offset="100%" stop-color="#ff5277"/>
          </linearGradient>
          <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a0845"/>
            <stop offset="45%" stop-color="#7b1fa2"/>
            <stop offset="80%" stop-color="#e040fb"/>
            <stop offset="100%" stop-color="#ffd54f"/>
          </linearGradient>
          <radialGradient id="blushGrad">
            <stop offset="0%" stop-color="#ff4081" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#ff4081" stop-opacity="0"/>
          </radialGradient>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- 背景氛围圆弧 -->
        <circle cx="200" cy="200" r="170" fill="url(#bgGrad)"/>
        <circle cx="200" cy="180" r="110" fill="#ff7eb6" opacity="0.22" filter="url(#softGlow)"/>

        <!-- 飘落星光/光斑 -->
        <circle cx="90" cy="100" r="6" fill="#fff" opacity="0.4"/>
        <circle cx="310" cy="120" r="8" fill="#fff" opacity="0.3"/>
        <circle cx="70" cy="280" r="10" fill="#ffb6c1" opacity="0.2"/>
        <circle cx="330" cy="260" r="9" fill="#e0b0ff" opacity="0.25"/>

        <!-- 后发双马尾 -->
        <path d="M 130 180 C 80 220 50 320 80 390 C 110 400 130 350 140 280 Z" fill="url(#hairGrad)"/>
        <path d="M 270 180 C 320 220 350 320 320 390 C 290 400 270 350 260 280 Z" fill="url(#hairGrad)"/>

        <!-- 猫耳 (左耳) -->
        <g class="ear-left">
          <path d="M 125 150 L 95 60 C 120 70 170 100 180 130 Z" fill="url(#hairGrad)"/>
          <path d="M 130 142 L 108 78 C 125 85 160 110 166 128 Z" fill="url(#innerEarGrad)"/>
          <!-- 绒毛 -->
          <path d="M 135 140 C 145 130 155 135 160 128 C 152 140 142 145 135 140 Z" fill="#ffffff"/>
        </g>

        <!-- 猫耳 (右耳) -->
        <g class="ear-right">
          <path d="M 275 150 L 305 60 C 280 70 230 100 220 130 Z" fill="url(#hairGrad)"/>
          <path d="M 270 142 L 292 78 C 275 85 240 110 234 128 Z" fill="url(#innerEarGrad)"/>
          <!-- 绒毛 -->
          <path d="M 265 140 C 255 130 245 135 240 128 C 248 140 258 145 265 140 Z" fill="#ffffff"/>
        </g>

        <!-- 右耳蝴蝶结发饰与金铃铛 -->
        <g transform="translate(265, 125)">
          <path d="M -12 -8 C -4 -4 0 0 -12 8 Z" fill="#ff4081"/>
          <path d="M 12 -8 C 4 -4 0 0 12 8 Z" fill="#ff4081"/>
          <circle cx="0" cy="0" r="5" fill="#ffd700"/>
        </g>

        <!-- 身体 / 女仆裙与领口 -->
        <path d="M 140 290 Q 200 280 260 290 L 320 440 L 80 440 Z" fill="#201433"/>
        <path d="M 160 295 L 240 295 L 255 440 L 145 440 Z" fill="#f8f7fc"/>
        <!-- 红色胸前领结与金铃 -->
        <path d="M 175 305 L 200 315 L 225 305 L 200 325 Z" fill="#e91e63"/>
        <circle cx="200" cy="328" r="6" fill="#ffd700"/>
        <circle cx="198" cy="326" r="2" fill="#fff"/>

        <!-- 脖子与颈圈 -->
        <rect x="185" y="255" width="30" height="35" rx="10" fill="#ffe0d6"/>
        <rect x="183" y="275" width="34" height="6" rx="3" fill="#2d174d"/>

        <!-- 脸部轮廓 -->
        <path d="M 135 180 C 130 230 155 270 200 270 C 245 270 270 230 265 180 C 265 130 135 130 135 180 Z" fill="#fff0ea"/>

        <!-- 腮红与猫咪胡须 -->
        <ellipse cx="160" cy="225" rx="18" ry="10" fill="url(#blushGrad)"/>
        <ellipse cx="240" cy="225" rx="18" ry="10" fill="url(#blushGrad)"/>
        <!-- 胡须小短线 -->
        <path d="M 135 220 L 150 222 M 133 226 L 150 226 M 136 232 L 151 230" stroke="#ff8da1" stroke-width="2" stroke-linecap="round"/>
        <path d="M 265 220 L 250 222 M 267 226 L 250 226 M 264 232 L 249 230" stroke="#ff8da1" stroke-width="2" stroke-linecap="round"/>

        <!-- 鼻子 -->
        <circle cx="200" cy="216" r="2.2" fill="#e57373"/>

        <!-- 猫咪嘴巴 'ω' + 小虎牙 -->
        <path d="M 192 230 Q 196 236 200 231 Q 204 236 208 230" fill="none" stroke="#c2185b" stroke-width="2.2" stroke-linecap="round"/>
        <polygon points="194,231 197,236 198,231" fill="#ffffff"/>

        <!-- 左眼 -->
        <g>
          <ellipse cx="168" cy="195" rx="16" ry="22" fill="url(#eyeGrad)"/>
          <ellipse cx="168" cy="193" rx="7" ry="10" fill="#1b002c"/>
          <!-- 眼神光 -->
          <circle cx="162" cy="186" r="5.5" fill="#ffffff"/>
          <circle cx="174" cy="204" r="3.2" fill="#ffffff"/>
          <circle cx="164" cy="206" r="2" fill="#ffd54f"/>
          <!-- 上眼睫毛 -->
          <path d="M 148 185 Q 168 172 188 185" fill="none" stroke="#2c163b" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 152 178 Q 168 170 184 178" fill="none" stroke="#d8a8be" stroke-width="1.8"/>
          <path d="M 152 165 Q 168 160 184 168" fill="none" stroke="#8e68b3" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- 右眼 -->
        <g>
          <ellipse cx="232" cy="195" rx="16" ry="22" fill="url(#eyeGrad)"/>
          <ellipse cx="232" cy="193" rx="7" ry="10" fill="#1b002c"/>
          <!-- 眼神光 -->
          <circle cx="226" cy="186" r="5.5" fill="#ffffff"/>
          <circle cx="238" cy="204" r="3.2" fill="#ffffff"/>
          <circle cx="228" cy="206" r="2" fill="#ffd54f"/>
          <!-- 上眼睫毛 -->
          <path d="M 212 185 Q 232 172 252 185" fill="none" stroke="#2c163b" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 216 178 Q 232 170 248 178" fill="none" stroke="#d8a8be" stroke-width="1.8"/>
          <path d="M 216 168 Q 232 160 248 165" fill="none" stroke="#8e68b3" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- 前发 / 齐刘海与鬓发 -->
        <!-- 侧鬓发 -->
        <path d="M 134 165 C 130 200 135 250 145 285 C 150 285 142 220 146 170 Z" fill="url(#hairGrad)"/>
        <path d="M 266 165 C 270 200 265 250 255 285 C 250 285 258 220 254 170 Z" fill="url(#hairGrad)"/>
        <!-- 齐刘海弧度 -->
        <path d="M 130 160 Q 200 130 270 160 Q 255 185 240 178 Q 220 190 200 178 Q 180 190 160 178 Q 145 185 130 160 Z" fill="url(#hairGrad)"/>
        <!-- 天使光环 / 头发高光 -->
        <path d="M 148 155 Q 200 145 252 155" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

        <!-- 萌宠肉球猫爪 (Nyan~ 姿态) -->
        <g class="paw">
          <!-- 爪子主体 -->
          <ellipse cx="270" cy="275" rx="22" ry="20" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
          <!-- 粉嫩肉球 (大) -->
          <ellipse cx="270" cy="278" rx="9" ry="8" fill="#ff7da7"/>
          <!-- 三颗小趾球 -->
          <circle cx="260" cy="266" r="3.5" fill="#ff7da7"/>
          <circle cx="270" cy="262" r="3.8" fill="#ff7da7"/>
          <circle cx="280" cy="266" r="3.5" fill="#ff7da7"/>
        </g>
      </svg>
    </div>

    <div class="title">🐾 喵呜~ 主人你好！</div>
    <div class="subtitle">点击画面可互动摇晃猫耳 · 高清矢量渲染</div>
  </div>

  <script>
    function twitchEars() {
      const leftEar = document.querySelector('.ear-left');
      const rightEar = document.querySelector('.ear-right');
      leftEar.style.transform = 'rotate(-15deg)';
      rightEar.style.transform = 'rotate(15deg)';
      setTimeout(() => {
        leftEar.style.transform = 'rotate(0deg)';
        rightEar.style.transform = 'rotate(0deg)';
      }, 300);
    }
  </script>
</body>
</html>
