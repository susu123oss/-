<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>鹈鹕骑行记 - Pelican On The Wheel 交互体验</title>
  <style>
    :root {
      --speed-mult: 1;
      --bg-color: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.45);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-color);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }

    /* 主舞台容器 */
    .app-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 顶部状态栏卡片 */
    .top-header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 26px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(251, 191, 36, 0.5));
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stats-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 核心动画视窗 */
    .stage-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 900 / 580;
      background: #000;
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .stage-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 浮动提示 */
    .stage-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 11.5px;
      color: #cbd5e1;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* 交互控制卡片面板 */
    .control-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ctrl-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 挡位与模式按钮组 */
    .btn-group {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      gap: 4px;
    }

    .btn-item {
      flex: 1;
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-item:hover {
      color: #fff;
    }

    .btn-item.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* 动作按钮 */
    .action-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.2);
    }

    /* 速度滑块 */
    .slider-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .slider-box input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .speed-text {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      min-width: 48px;
      text-align: right;
    }

    /* 吐泡泡/吃鱼漂浮通知 */
    .toast-overlay {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(16, 185, 129, 0.9);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 9999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast-overlay.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 主题样式定义 */
    .theme-sunset #skyGrad stop:nth-child(1) { stop-color: #f97316; }
    .theme-sunset #skyGrad stop:nth-child(2) { stop-color: #ec4899; }
    .theme-sunset #skyGrad stop:nth-child(3) { stop-color: #431407; }
    .theme-sunset #roadGrad stop:nth-child(1) { stop-color: #451a03; }
    .theme-sunset #roadGrad stop:nth-child(2) { stop-color: #1c1917; }

    .theme-night #skyGrad stop:nth-child(1) { stop-color: #030712; }
    .theme-night #skyGrad stop:nth-child(2) { stop-color: #1e1b4b; }
    .theme-night #skyGrad stop:nth-child(3) { stop-color: #0f172a; }
    .theme-night #roadGrad stop:nth-child(1) { stop-color: #1e293b; }
    .theme-night #roadGrad stop:nth-child(2) { stop-color: #020617; }

    .theme-cyber #skyGrad stop:nth-child(1) { stop-color: #4c1d95; }
    .theme-cyber #skyGrad stop:nth-child(2) { stop-color: #0f172a; }
    .theme-cyber #skyGrad stop:nth-child(3) { stop-color: #064e3b; }
    .theme-cyber #frameGrad stop:nth-child(1) { stop-color: #f43f5e; }
    .theme-cyber #frameGrad stop:nth-child(2) { stop-color: #ec4899; }
    .theme-cyber #frameGrad stop:nth-child(3) { stop-color: #8b5cf6; }

    /* 快捷键脚标 */
    .shortcut-footer {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 顶部状态栏 -->
  <header class="top-header">
    <div class="brand">
      <div class="brand-icon">🚴</div>
      <div>
        <div class="brand-title">鹈鹕漫骑 · Pelican Cruiser</div>
        <div class="brand-subtitle">纯矢量 SVG + Web Audio 合成音效交互体验</div>
      </div>
    </div>
    <div class="stats-badge">
      <div class="stat-dot"></div>
      <span id="speedDisplay">24 km/h</span>
    </div>
  </header>

  <!-- 核心视窗 -->
  <div class="stage-wrapper" id="stageWrapper" title="轻触画布：鹈鹕吞鱼 / 按车铃">
    <div class="toast-overlay" id="toastMsg">🔔 叮叮！车铃响脆～</div>
    <div class="stage-hint">💡 点击车铃 / 喉囊可触发互动动作</div>

    <!-- 嵌入 SVG 主体 -->
    <svg id="pelicanSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
      <defs>
        <!-- 背景渐变 -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bae6fd"/>
          <stop offset="55%" stop-color="#e0f2fe"/>
          <stop offset="100%" stop-color="#f0fdf4"/>
        </linearGradient>

        <!-- 道路渐变 -->
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#334155"/>
          <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>

        <!-- 鹈鹕大嘴囊渐变 -->
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fbbf24"/>
          <stop offset="60%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>

        <!-- 鹈鹕身体羽毛渐变 -->
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e2e8f0"/>
        </linearGradient>

        <!-- 车身金属质感渐变 -->
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="50%" stop-color="#0284c7"/>
          <stop offset="100%" stop-color="#0369a1"/>
        </linearGradient>

        <!-- 车轮辐条组合 -->
        <g id="wheelSpokes">
          <circle cx="0" cy="0" r="58" fill="none" stroke="#64748b" stroke-width="6"/>
          <circle cx="0" cy="0" r="54" fill="none" stroke="#94a3b8" stroke-width="2"/>
          <circle cx="0" cy="0" r="10" fill="#475569"/>
          <circle cx="0" cy="0" r="5" fill="#e2e8f0"/>
          <line x1="0" y1="-54" x2="0" y2="54" stroke="#cbd5e1" stroke-width="1.8"/>
          <line x1="-54" y1="0" x2="54" y2="0" stroke="#cbd5e1" stroke-width="1.8"/>
          <line x1="-38.2" y1="-38.2" x2="38.2" y2="38.2" stroke="#cbd5e1" stroke-width="1.8"/>
          <line x1="-38.2" y1="38.2" x2="38.2" y2="-38.2" stroke="#cbd5e1" stroke-width="1.8"/>
          <line x1="-20.7" y1="-49.9" x2="20.7" y2="49.9" stroke="#cbd5e1" stroke-width="1.5"/>
          <line x1="20.7" y1="-49.9" x2="-20.7" y2="49.9" stroke="#cbd5e1" stroke-width="1.5"/>
          <line x1="-49.9" y1="-20.7" x2="49.9" y2="20.7" stroke="#cbd5e1" stroke-width="1.5"/>
          <line x1="49.9" y1="-20.7" x2="-49.9" y2="20.7" stroke="#cbd5e1" stroke-width="1.5"/>
        </g>

        <!-- 鱼尾小彩蛋 -->
        <g id="fishTail">
          <path d="M0,0 Q-12,-8 -20,-3 Q-14,0 -20,3 Q-12,8 0,0 Z" fill="#38bdf8"/>
        </g>
      </defs>

      <style>
        :root {
          --dur-spin: 0.75s;
          --dur-road: 0.45s;
          --dur-bob: 0.375s;
          --dur-pouch: 0.55s;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counterSpin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        @keyframes roadMove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120; } }
        @keyframes cloudFloat { 0% { transform: translateX(0); } 100% { transform: translateX(-900px); } }
        @keyframes bodyBob { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-7px) rotate(-1.5deg); } }
        @keyframes pouchJiggle { 0%, 100% { transform: scale(1) rotate(0deg); } 35% { transform: scale(1.04, 0.96) rotate(2.5deg); } 70% { transform: scale(0.96, 1.05) rotate(-2deg); } }
        @keyframes scarfWave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(14deg) skewX(7deg); } }
        @keyframes eyeBlink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
        @keyframes windDash { 0% { stroke-dashoffset: 200; opacity: 0; } 50% { opacity: 0.8; } 100% { stroke-dashoffset: -200; opacity: 0; } }
        @keyframes bellRing { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.3) rotate(-15deg); } 50% { transform: scale(1.3) rotate(15deg); } 75% { transform: scale(1.2) rotate(-10deg); } }

        .wheel-rear { animation: spin var(--dur-spin) linear infinite; transform-origin: 255px 440px; }
        .wheel-front { animation: spin var(--dur-spin) linear infinite; transform-origin: 595px 440px; }
        .pedal-spin { animation: spin var(--dur-spin) linear infinite; transform-origin: 395px 440px; }
        .pedal-counter { animation: counterSpin var(--dur-spin) linear infinite; transform-origin: center; }
        .road-dash { animation: roadMove var(--dur-road) linear infinite; }
        .pelican-rider { animation: bodyBob var(--dur-bob) ease-in-out infinite; transform-origin: 350px 320px; }
        .pouch-anim { animation: pouchJiggle var(--dur-pouch) ease-in-out infinite; transform-origin: 520px 220px; }
        .scarf-anim { animation: scarfWave 0.28s ease-in-out infinite alternate; transform-origin: 430px 245px; }
        .eye-anim { animation: eyeBlink 3.4s infinite; transform-origin: 495px 165px; }
        .wind-line-1 { stroke-dasharray: 60, 100; animation: windDash 1.1s linear infinite; }
        .wind-line-2 { stroke-dasharray: 80, 120; animation: windDash 0.85s linear infinite 0.3s; }
        .bell-animated { animation: bellRing 0.4s ease-in-out; }
      </style>

      <!-- 1. 天空与远景 -->
      <rect width="900" height="580" fill="url(#skyGrad)"/>

      <!-- 动态云朵 -->
      <g opacity="0.65">
        <g style="animation: cloudFloat 26s linear infinite;">
          <path d="M120,90 Q140,65 175,75 Q210,55 240,85 Q265,85 270,105 Q275,125 245,125 L125,125 Q95,125 100,105 Q105,88 120,90 Z" fill="#ffffff"/>
          <path d="M560,110 Q585,85 620,95 Q650,75 680,105 Q705,105 710,125 Q710,145 680,145 L565,145 Q535,145 540,125 Q545,108 560,110 Z" fill="#ffffff"/>
          <path d="M1020,90 Q1040,65 1075,75 Q1110,55 1140,85 Q1165,85 1170,105 L1025,125 Z" fill="#ffffff"/>
          <path d="M1460,110 Q1485,85 1520,95 Q1550,75 1580,105 L1465,145 Z" fill="#ffffff"/>
        </g>
      </g>

      <!-- 风速线 -->
      <line x1="180" y1="130" x2="30" y2="130" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" class="wind-line-1"/>
      <line x1="720" y1="210" x2="560" y2="210" stroke="#bae6fd" stroke-width="3.5" stroke-linecap="round" class="wind-line-2"/>
      <line x1="280" y1="280" x2="100" y2="280" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" class="wind-line-1"/>

      <!-- 2. 地面与公路 -->
      <rect x="0" y="475" width="900" height="105" fill="url(#roadGrad)"/>
      <rect x="0" y="472" width="900" height="4" fill="#10b981"/>
      <line x1="0" y1="535" x2="900" y2="535" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-dasharray="45 35" class="road-dash"/>
      <line x1="0" y1="570" x2="900" y2="570" stroke="#475569" stroke-width="3" stroke-dasharray="25 60" class="road-dash"/>

      <!-- 3. 自行车投影 -->
      <ellipse cx="400" cy="485" rx="220" ry="14" fill="#0f172a" opacity="0.32"/>

      <!-- 4. 自行车后轮 (轴心 255, 440 精准原地旋转) -->
      <g id="rearWheelGroup">
        <g class="wheel-rear">
          <use href="#wheelSpokes" x="255" y="440"/>
        </g>
        <g transform="translate(255, 440)">
          <path d="M-64,-10 A64,64 0 0,1 42,-50" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 5. 自行车前轮 (轴心 595, 440 精准原地旋转) -->
      <g id="frontWheelGroup">
        <g class="wheel-front">
          <use href="#wheelSpokes" x="595" y="440"/>
        </g>
        <g transform="translate(595, 440)">
          <path d="M-30,-58 A64,64 0 0,1 60,-15" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
        </g>
      </g>

  <!-- 远侧左腿 (位于车架后方，阴影层) -->
  <g id="leftLegGroup">
    <path id="leftLegPath" d="M350,312 Q412.0,340.0 395.0,410.0" fill="none" stroke="#d97706" stroke-width="8.5" stroke-linecap="round">
      <animate id="leftLegAnim" attributeName="d" dur="0.75s" repeatCount="indefinite" values="M350,312 Q412.0,340.0 395.0,410.0; M350,312 Q408.2,347.2 416.2,418.8; M350,312 Q391.3,366.0 425.0,440.0; M350,312 Q385.0,370.3 416.2,461.2; M350,312 Q376.5,374.6 395.0,470.0; M350,312 Q368.9,377.3 373.8,461.2; M350,312 Q384.4,370.7 365.0,440.0; M350,312 Q403.9,353.4 373.8,418.8; M350,312 Q412.0,340.0 395.0,410.0"/>
    </path>
    <!-- 远侧裤腿 -->
    <path d="M340,305 C345,330 365,330 368,308 Z" fill="#94a3b8" opacity="0.8"/>
  </g>

      <!-- 6. 自行车车架 -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <line x1="255" y1="440" x2="395" y2="440" stroke="#0369a1" stroke-width="8"/>
        <path d="M255,440 L395,432 L395,448 Z" fill="none" stroke="#64748b" stroke-width="4"/>
        <line x1="255" y1="440" x2="335" y2="325" stroke="url(#frameGrad)" stroke-width="9"/>
        <line x1="395" y1="440" x2="335" y2="325" stroke="url(#frameGrad)" stroke-width="10"/>
        <line x1="335" y1="325" x2="325" y2="300" stroke="#64748b" stroke-width="7"/>
        <path d="M295,300 C300,292 320,290 345,292 C365,294 372,305 355,307 C335,308 305,308 295,300 Z" fill="#78350f"/>
        <ellipse cx="305" cy="305" rx="5" ry="3" fill="#b45309"/>
        <line x1="395" y1="440" x2="530" y2="305" stroke="url(#frameGrad)" stroke-width="11"/>
        <path d="M335,325 Q430,328 530,305" fill="none" stroke="url(#frameGrad)" stroke-width="10"/>
        <line x1="530" y1="305" x2="595" y2="440" stroke="url(#frameGrad)" stroke-width="9"/>
        <line x1="530" y1="305" x2="515" y2="250" stroke="#94a3b8" stroke-width="7"/>
        <path d="M490,248 C510,240 522,242 535,255" fill="none" stroke="#475569" stroke-width="8"/>
        <rect x="482" y="244" width="16" height="9" rx="3" fill="#ea580c"/>
        <!-- 金色小车铃 -->
        <g id="bikeBellGroup" cursor="pointer">
          <circle id="bikeBell" cx="528" cy="242" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
          <circle cx="530" cy="240" r="2.5" fill="#ffffff"/>
        </g>
      </g>

      <!-- 7. 鹈鹕主体 -->
      <g class="pelican-rider">
        <path d="M260,285 Q240,270 250,298 Q260,312 285,310 Z" fill="#cbd5e1"/>
        <path d="M268,278 Q250,265 260,290 Z" fill="#e2e8f0"/>

        <!-- 围巾 -->
        <g class="scarf-anim">
          <path d="M405,248 C360,250 320,225 280,230 C310,245 350,265 395,258 Z" fill="#ef4444"/>

        <circle cx="475" cy="165" r="32" fill="url(#bodyGrad)"/>

        <g class="eye-anim">

        <g transform="translate(470, 142) rotate(-8)">

        </g>
        <line x1="395" y1="440" x2="395" y2="408" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

          <g class="pedal-counter">

      <g class="pelican-rider">
        <path d="M358,335 Q395,380 395,455" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
        <path d="M345,325 C355,350 375,350 378,328 Z" fill="#e2e8f0"/>
      </g>

      <!-- 速度风痕 -->
      <path d="M680,430 L740,430" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" class="wind-line-2"/>
      <path d="M660,370 L710,370" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" opacity="0.6" class="wind-line-1"/>
      <path d="M640,465 L690,465" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" opacity="0.8" class="wind-line-2"/>

  </div>

  <!-- 下方互动控制卡片 -->
  <div class="control-panel">
    <!-- 1. 速度控制 -->
    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>骑行速度调节</span>
        <span id="gearLabel">中速匀行</span>
      </div>
      <div class="slider-box">
        <span>🐢</span>
        <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1.0">
        <span>⚡</span>
        <div class="speed-text" id="speedValText">1.0x</div>
      </div>
      <div class="btn-group">
        <button class="btn-item" onclick="setSpeed(0)">🛑 刹车</button>
        <button class="btn-item" onclick="setSpeed(0.6)">🚶 漫游</button>
        <button class="btn-item active" onclick="setSpeed(1.0)">🚴 匀速</button>
        <button class="btn-item" onclick="setSpeed(2.2)">🚀 狂飙</button>
      </div>
    </div>

    <!-- 2. 趣味互动动作 -->
    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>趣味动作触发</span>
        <span>交互响应</span>
      </div>
      <div class="action-row">
        <button class="action-btn" onclick="ringBell()">🔔 按车铃</button>
        <button class="action-btn" onclick="pelicanHonk()">🦆 鹈鹕叫</button>
        <button class="action-btn" onclick="feedFish()">🐟 吞小鱼</button>
      </div>
      <div class="btn-group">
        <button class="btn-item active" onclick="setTheme('day', this)">☀️ 白天</button>
        <button class="btn-item" onclick="setTheme('sunset', this)">🌇 晚霞</button>
        <button class="btn-item" onclick="setTheme('night', this)">🌙 黑夜</button>
        <button class="btn-item" onclick="setTheme('cyber', this)">⚡ 赛博</button>
      </div>
    </div>
  </div>

  <div class="shortcut-footer">
    按 [空格键] 暂停/启动 ｜ 按 [B] 键响铃 ｜ 按 [F] 键喂鱼 ｜ 支持手机触摸与全屏自适应
  </div>

</div>

<script>
  // Web Audio 声音合成器（纯原生，无外部依赖）
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 1. 合成清脆双音车铃声 "Ding-Ding!"
  function ringBell() {
    initAudio();
    showToast("🔔 叮！叮！车铃脆响～");
    
    // 铃铛抖动动画
    const bellGroup = document.getElementById("bikeBellGroup");
    if (bellGroup) {
      bellGroup.classList.remove("bell-animated");
      void bellGroup.offsetWidth; // 触发 reflow
      bellGroup.classList.add("bell-animated");
    }

    const now = audioCtx.currentTime;
    playChime(now, 2093);      // 高音 C7
    playChime(now + 0.12, 2349); // 高音 D7
  }

  function playChime(startTime, freq) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, startTime);

    gain.gain.setValueAtTime(0.28, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.55);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(startTime);
    osc.stop(startTime + 0.55);
  }

  // 2. 合成鹈鹕呆萌叫声 "Honk-Honk!"
  function pelicanHonk() {
    initAudio();
    showToast("🦆 嘎——！鹈鹕欢快呼叫");

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.28);

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.3);
  }

  // 3. 喂小鱼动作与吞咽水泡音效
  function feedFish() {
    initAudio();
    showToast("🐟 咕噜！大喉囊吞下一条小鱼～");

    const pouch = document.getElementById("pelicanPouchGroup");
    if (pouch) {
      pouch.style.transform = "scale(1.25) rotate(5deg)";
      setTimeout(() => {
        pouch.style.transform = "";
      }, 350);
    }

    const now = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const t = now + i * 0.08;
      osc.type = "sine";
      osc.frequency.setValueAtTime(400 + i * 150, t);
      osc.frequency.exponentialRampToValueAtTime(800 + i * 200, t + 0.08);

      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + 0.08);
    }
  }

  // 速度调节逻辑
  const svg = document.getElementById("pelicanSvg");
  const speedSlider = document.getElementById("speedSlider");
  const speedValText = document.getElementById("speedValText");
  const speedDisplay = document.getElementById("speedDisplay");
  const gearLabel = document.getElementById("gearLabel");

  function updateSpeed(factor) {
    speedSlider.value = factor;
    speedValText.textContent = factor.toFixed(1) + "x";
    
    const kmh = Math.round(factor * 24);
    speedDisplay.textContent = kmh + " km/h";

    if (factor === 0) {
      gearLabel.textContent = "已刹车停留";
      svg.style.setProperty("--dur-spin", "0s");
      svg.style.setProperty("--dur-road", "0s");
      svg.style.setProperty("--dur-bob", "0s");
      svg.style.setProperty("--dur-pouch", "0s");
      svg.classList.add("paused");
      document.querySelectorAll(".wheel-rear, .wheel-front, .pedal-spin, .pedal-counter, .road-dash, .pelican-rider, .pouch-anim, .wind-line-1, .wind-line-2").forEach(el => {
        el.style.animationPlayState = "paused";
      });
    } else {
      svg.classList.remove("paused");
      svg.unpauseAnimations();
      const legDur = (0.75 / factor).toFixed(3) + "s";
      const la1 = document.getElementById("leftLegAnim");
      const la2 = document.getElementById("rightLegAnim");
      if (la1) la1.setAttribute("dur", legDur);
      if (la2) la2.setAttribute("dur", legDur);
      document.querySelectorAll(".wheel-rear, .wheel-front, .pedal-spin, .pedal-counter, .road-dash, .pelican-rider, .pouch-anim, .wind-line-1, .wind-line-2").forEach(el => {
        el.style.animationPlayState = "running";
      });

      if (factor <= 0.6) gearLabel.textContent = "悠闲慢行";
      else if (factor <= 1.2) gearLabel.textContent = "中速匀行";
      else gearLabel.textContent = "极速狂飙 🔥";

      const spinDur = (0.75 / factor).toFixed(3) + "s";
      const roadDur = (0.45 / factor).toFixed(3) + "s";
      const bobDur = (0.375 / factor).toFixed(3) + "s";
      const pouchDur = (0.55 / factor).toFixed(3) + "s";

      svg.style.setProperty("--dur-spin", spinDur);
      svg.style.setProperty("--dur-road", roadDur);
      svg.style.setProperty("--dur-bob", bobDur);
      svg.style.setProperty("--dur-pouch", pouchDur);
    }
  }

  speedSlider.addEventListener("input", (e) => {
    updateSpeed(parseFloat(e.target.value));
  });

  function setSpeed(val) {
    updateSpeed(val);
    document.querySelectorAll(".btn-group .btn-item").forEach(btn => {
      btn.classList.remove("active");
    });
    if (event && event.target) {
      event.target.classList.add("active");
    }
  }

  // 主题切换
  function setTheme(name, btn) {
    const wrapper = document.getElementById("stageWrapper");
    wrapper.className = "stage-wrapper theme-" + name;
    if (btn) {
      btn.parentElement.querySelectorAll(".btn-item").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }
    showToast("🎨 场景已切换为 " + (name === 'day' ? '日间晴空' : name === 'sunset' ? '晚霞落日' : name === 'night' ? '静谧黑夜' : '赛博霓虹'));
  }

  // 浮层提示
  let toastTimer = null;
  function showToast(text) {
    const toast = document.getElementById("toastMsg");
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 1800);
  }

  // 舞台内直触响应
  document.getElementById("bikeBellGroup").addEventListener("click", (e) => {
    e.stopPropagation();
    ringBell();
  });

  document.getElementById("pelicanPouchGroup").addEventListener("click", (e) => {
    e.stopPropagation();
    feedFish();
  });

  document.getElementById("stageWrapper").addEventListener("click", () => {
    ringBell();
  });

  // 键盘快捷键响应
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      const current = parseFloat(speedSlider.value);
      setSpeed(current > 0 ? 0 : 1.0);
    } else if (e.key === "b" || e.key === "B") {
      ringBell();
    } else if (e.key === "f" || e.key === "F") {
      feedFish();
    }
  });
</script>
